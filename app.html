<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#fff5fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nuvvu Nenu</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&family=Pacifico&display=swap" rel="stylesheet">
  <!-- Font Awesome (used by nav + buttons across pages) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Always cute pastel theme. Dark mode is disabled for now. -->
  <script>
    (function () {
      try {
        document.documentElement.classList.add('theme-cute');
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('theme-cute');
          // wipe any legacy theme key so a refresh stays cute
          try { localStorage.removeItem('nvvunenu.theme'); } catch (e) {}
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#fff5fa');
        });
      } catch (e) {}
    })();
  </script>

  <!-- Core (modern) — will be overridden by /styles/cute/* below -->
  <link rel="stylesheet" href="styles/core.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/motion.css">
  <link rel="stylesheet" href="styles/nav.css">
  <link rel="stylesheet" href="styles/skeleton.css">
  <link rel="stylesheet" href="styles/cuteFx.css">

  <!-- Page styles -->
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/space.css">
  <link rel="stylesheet" href="styles/moments.css">
  <link rel="stylesheet" href="styles/bond.css">
  <link rel="stylesheet" href="styles/profile.css">
  <link rel="stylesheet" href="styles/premium.css">
  <link rel="stylesheet" href="styles/chat.css">
  <link rel="stylesheet" href="styles/call.css">
  <link rel="stylesheet" href="styles/feed.css">
  <link rel="stylesheet" href="styles/profileView.css">

  <!-- Cute overlay layer (BROKEN-snapshot visual identity) — LOADED LAST,
       full of !important rules that override the base theme to give the
       pastel pink/purple glass aesthetic with FA-icon nav + bouncy buttons. -->
  <link rel="stylesheet" href="styles/cute/cute.css">
  <link rel="stylesheet" href="styles/cute/premium-glass.css">
  <link rel="stylesheet" href="styles/cute/feed-extra.css">
  <link rel="stylesheet" href="styles/cute/messages-extra.css">
  <link rel="stylesheet" href="styles/cute/partner-extra.css">
  <link rel="stylesheet" href="styles/cute/profile-extra.css">
  <link rel="stylesheet" href="styles/cute/search-extra.css">
  <link rel="stylesheet" href="styles/cute/settings-extra.css">
  <link rel="stylesheet" href="styles/cute/space-polish.css">
  <link rel="stylesheet" href="styles/cute/upgrade.css">
  <link rel="stylesheet" href="styles/cute/ig.css">
  <link rel="stylesheet" href="styles/cute/layout.css">

  <!-- The actual OLD styles.css (recovered from MISC) — loaded LAST so it
       dominates everything. 711 rules, purple gradient body, glass side-nav,
       Instagram-style feed classes (.post-card, .post-img, .stories-strip,
       .like-heart). This is what the user has been asking for. -->
  <link rel="stylesheet" href="styles/old.css">
  <!-- Patches for old.css's known-bad global selectors (button{width:250px},
       input{width:250px}, video{...}) and lock-in for the purple body bg. -->
  <link rel="stylesheet" href="styles/old-fixes.css">

  <!-- DEFINITIVE BLUR KILL — loaded last. Strips backdrop-filter from
       everything except the floating nav rails so pages render crisp on
       top of the cute hearts background instead of being foggy. -->
  <link rel="stylesheet" href="styles/no-blur.css">

  <!-- Premium cinematic visual layer — deeper purple gradient body, ambient
       aurora background, soft neon glow on cards/buttons, smoother page
       transitions. Loaded AFTER no-blur so it controls colour/atmosphere
       while the no-blur structural rules stay in effect. -->
  <link rel="stylesheet" href="styles/premium-look.css">

  <!-- Final inline override for the bottom-nav (loaded LAST so it wins
       any cascade fight). Uses very high specificity (html body) to beat
       earlier `body:not(.auth-body) button` rules. -->
  <style>
    @media (max-width: 900px) {
      html body nav.bottom-nav {
        position: fixed !important;
        left: 50% !important;
        right: auto !important;
        bottom: 10px !important;
        transform: translateX(-50%) !important;
        width: calc(100vw - 24px) !important;
        max-width: 420px !important;
        margin: 0 !important;
        padding: 6px 8px !important;
        border-radius: 22px !important;
        z-index: 9999 !important;
        display: grid !important;
        grid-template-columns: repeat(6, 1fr) !important;
        gap: 4px !important;
        align-items: center !important;
        box-sizing: border-box !important;
      }
      html body nav.bottom-nav > button {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        height: 38px !important;
        padding: 0 !important;
        margin: 0 !important;
        font-size: 15px !important;
        border-radius: 11px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box !important;
        background: rgba(255, 255, 255, 0.5) !important;
        color: #2a235a !important;
        border: none !important;
        flex: none !important;
      }
      html body nav.bottom-nav > button.active {
        background: linear-gradient(135deg, #8f74ff, #bda6ff) !important;
        color: #fff !important;
        transform: none !important;
      }
    }
    @media (min-width: 901px) {
      html body nav.bottom-nav { display: none !important; }
    }

    /* Initial loading state — visible until a page module replaces #page */
    .app-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 60px 20px;
      min-height: 60vh;
      text-align: center;
    }
    .app-loading-orb {
      width: 84px; height: 84px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 143, 177, 0.55), rgba(167, 139, 250, 0.25) 60%, transparent 80%);
      animation: appLoadBreathe 3.5s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(255, 143, 177, 0.45);
      display: grid; place-items: center; font-size: 38px; color: #a78bfa;
    }
    .app-loading-orb::after { content: '💜'; }
    .app-loading-title {
      font-size: 1.4rem; font-weight: 800; letter-spacing: 0.3px;
      background: linear-gradient(135deg, #ff8fb1, #a78bfa);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .app-loading-sub { font-size: 0.875rem; color: #7c6f8e; }
    @keyframes appLoadBreathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-shell"><div id="page">
      <div class="app-loading" aria-hidden="true">
        <div class="app-loading-orb"></div>
        <div class="app-loading-title">Nuvvu Nenu</div>
        <div class="app-loading-sub">Loading your space…</div>
      </div>
    </div></div>

    <!-- Desktop side / top navigation (md+ screens) -->
    <nav class="desktop-nav side-nav" id="navDesktop" aria-label="Primary navigation">
      <button data-page="home"     id="nav-home-desktop"     onclick="loadPage('home')"    ><i class="fas fa-house"></i><span>Home</span></button>
      <button data-page="together" id="nav-together-desktop" onclick="loadPage('together')"><i class="fas fa-people-arrows"></i><span>Together</span></button>
      <button data-page="chat"     id="nav-chat-desktop"     onclick="loadPage('chat')"    ><i class="fas fa-comment-dots"></i><span>Chat</span></button>
      <button data-page="memories" id="nav-memories-desktop" onclick="loadPage('memories')"><i class="fas fa-camera-retro"></i><span>Memories</span></button>
      <button data-page="space"    id="nav-space-desktop"    onclick="loadPage('space')"   ><i class="fas fa-star"></i><span>Space</span></button>
      <button data-page="profile"  id="nav-profile-desktop"  onclick="loadPage('profile')" ><i class="fas fa-user"></i><span>Profile</span></button>
      <button data-page="feed"     id="nav-feed-desktop"     onclick="loadPage('feed')"    ><i class="fas fa-globe"></i><span>Feed</span></button>
      <button data-page="search"   id="nav-search-desktop"   onclick="loadPage('search')"  ><i class="fas fa-search"></i><span>Search</span></button>
      <button data-page="settings" id="nav-settings-desktop" onclick="loadPage('settings')"><i class="fas fa-gear"></i><span>Settings</span></button>
    </nav>

    <!-- Mobile bottom navigation -->
    <nav class="bottom-nav" id="navBottom">
      <button data-page="home"     onclick="loadPage('home')"    ><i class="fas fa-house"></i></button>
      <button data-page="together" onclick="loadPage('together')"><i class="fas fa-people-arrows"></i></button>
      <button data-page="chat"     onclick="loadPage('chat')"    ><i class="fas fa-comment-dots"></i></button>
      <button data-page="memories" onclick="loadPage('memories')"><i class="fas fa-camera-retro"></i></button>
      <button data-page="space"    onclick="loadPage('space')"   ><i class="fas fa-star"></i></button>
      <button data-page="profile"  onclick="loadPage('profile')" ><i class="fas fa-user"></i></button>
    </nav>

    <!-- Toast (used by utils/toast.js) -->
    <div id="toast" class="toast global-toast"></div>
  </div>

  <!-- Bootstrap -->
  <script type="module" src="./app.js"></script>
</body>
</html>
