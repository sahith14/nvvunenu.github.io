<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Nuvvu Nenu — Sign Up</title>
  <meta name="theme-color" content="#0F1117">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Inter',system-ui,sans-serif;min-height:100dvh;
      background:#0F1117;color:#F5F7FA;
      display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .signup-container{width:100%;max-width:380px;text-align:center}
    .logo{font-size:48px;margin-bottom:8px}
    .title{font-size:1.75rem;font-weight:800;background:linear-gradient(135deg,#FF7EB6,#9B8CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
    .subtitle{color:#98A2B3;font-size:.875rem;margin-top:4px;margin-bottom:32px}
    .form-group{margin-bottom:16px;text-align:left}
    .form-group label{display:block;font-size:.75rem;color:#98A2B3;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
    .form-group input{
      width:100%;padding:14px 16px;background:#1E2230;border:1px solid rgba(255,255,255,.06);
      border-radius:14px;color:#F5F7FA;font-size:.9375rem;transition:border-color .2s;
    }
    .form-group input:focus{border-color:rgba(155,140,255,.4);outline:none}
    .btn{
      width:100%;padding:14px;border-radius:99px;border:none;font-weight:600;
      font-size:.9375rem;cursor:pointer;transition:all .2s cubic-bezier(.22,1,.36,1);margin-top:8px;
    }
    .btn-primary{background:linear-gradient(135deg,#FF7EB6,#9B8CFF);color:#fff;box-shadow:0 4px 16px rgba(255,126,182,.3)}
    .btn-primary:active{transform:scale(.97)}
    .btn-google{
      background:#1E2230;color:#F5F7FA;border:1px solid rgba(255,255,255,.06);
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-google:active{background:#252A3A}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#98A2B3;font-size:.75rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
    .footer-link{margin-top:24px;font-size:.8125rem;color:#98A2B3}
    .footer-link a{color:#9B8CFF;font-weight:500}
    .error{color:#FF7EB6;font-size:.8125rem;margin-top:8px;display:none}
    .relationship-type{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    .type-btn{
      padding:10px;background:#1E2230;border:1px solid rgba(255,255,255,.06);
      border-radius:12px;font-size:.8125rem;color:#98A2B3;cursor:pointer;transition:all .2s;
    }
    .type-btn.selected{border-color:rgba(155,140,255,.4);color:#9B8CFF;background:rgba(155,140,255,.08)}
    .type-btn:active{transform:scale(.97)}
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="logo">💜</div>
    <h1 class="title">Nuvvu Nenu</h1>
    <p class="subtitle">Create your private space together</p>

    <form id="signupForm" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="name" placeholder="Your first name" required autocomplete="given-name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Relationship Type</label>
        <div class="relationship-type" id="relType">
          <button type="button" class="type-btn" data-type="long-distance" onclick="selectType(this)">🌍 Long Distance</button>
          <button type="button" class="type-btn" data-type="nearby" onclick="selectType(this)">📍 Nearby</button>
          <button type="button" class="type-btn" data-type="married" onclick="selectType(this)">💍 Married</button>
          <button type="button" class="type-btn" data-type="dating" onclick="selectType(this)">💕 Dating</button>
        </div>
      </div>
      <p class="error" id="error"></p>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="divider">or</div>
    <button class="btn btn-google" onclick="handleGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <p class="footer-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script type="module">
    import { auth, signupEmail, googleLogin } from './firebase.js';
    import { updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { db } from './firebase.js';

    let selectedType = '';
    window.selectType = function(btn) {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedType = btn.dataset.type;
    };

    window.handleSignup = async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const err = document.getElementById('error');
      try {
        const cred = await signupEmail(email, pass);
        await updateProfile(cred.user, { displayName: name });
        await setDoc(doc(db, 'users', cred.user.uid), {
          displayName: name, email, relationshipType: selectedType || 'dating',
          createdAt: serverTimestamp(), togetherSince: serverTimestamp()
        });
        window.location.href = 'app.html';
      } catch(ex) {
        err.style.display = 'block';
        err.textContent = ex.code === 'auth/email-already-in-use' ? 'Email already in use' : 'Signup failed. Try again.';
      }
    };

    window.handleGoogle = async function() {
      try {
        const result = await googleLogin();
        await setDoc(doc(db, 'users', result.user.uid), {
          displayName: result.user.displayName, email: result.user.email,
          relationshipType: selectedType || 'dating',
          createdAt: serverTimestamp(), togetherSince: serverTimestamp()
        }, { merge: true });
        window.location.href = 'app.html';
      } catch(ex) {
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Google signup failed';
      }
    };
  </script>
</body>
</html>
