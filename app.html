<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#0F1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nuvvu Nenu</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core design system -->
  <link rel="stylesheet" href="styles/core.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/motion.css">
  <link rel="stylesheet" href="styles/nav.css">

  <!-- Page styles -->
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/space.css">
  <link rel="stylesheet" href="styles/moments.css">
  <link rel="stylesheet" href="styles/bond.css">
  <link rel="stylesheet" href="styles/profile.css">
  <link rel="stylesheet" href="styles/premium.css">

  <!-- New feature styles -->
  <link rel="stylesheet" href="styles/chat.css">
  <link rel="stylesheet" href="styles/call.css">
</head>
<body>
  <div id="app">
    <div class="app-shell"><div id="page"></div></div>

    <nav class="bottom-nav" id="nav">
      <button data-page="home"    onclick="loadPage('home')"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
      <button data-page="space"   onclick="loadPage('space')"><span class="nav-icon">✨</span><span class="nav-label">Space</span></button>
      <button data-page="chat"    onclick="loadPage('chat')"><span class="nav-icon">💌</span><span class="nav-label">Chat</span></button>
      <button data-page="moments" onclick="loadPage('moments')"><span class="nav-icon">📸</span><span class="nav-label">Moments</span></button>
      <button data-page="bond"    onclick="loadPage('bond')"><span class="nav-icon">💫</span><span class="nav-label">Bond</span></button>
      <button data-page="profile" onclick="loadPage('profile')"><span class="nav-icon">🫧</span><span class="nav-label">You</span></button>
    </nav>

    <div id="toast" class="toast"></div>
  </div>

  <!-- Modular bootstrap -->
  <script type="module" src="./app.js"></script>
</body>
</html>
