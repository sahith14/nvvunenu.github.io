<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#0F1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuvvu Nenu">
  <link rel="manifest" href="manifest.json">
  <title>Nuvvu Nenu</title>
  <meta name="description" content="Nuvvu Nenu — The emotional operating system for your relationship.">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/core.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/motion.css">
  <link rel="stylesheet" href="styles/nav.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/space.css">
  <link rel="stylesheet" href="styles/moments.css">
  <link rel="stylesheet" href="styles/bond.css">
  <link rel="stylesheet" href="styles/profile.css">
  <link rel="stylesheet" href="styles/premium.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <div id="page"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
      <button data-page="home" onclick="loadPage('home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>
      <button data-page="space" onclick="loadPage('space')">
        <span class="nav-icon">✨</span>
        <span class="nav-label">Space</span>
      </button>
      <button data-page="moments" onclick="loadPage('moments')">
        <span class="nav-icon">💜</span>
        <span class="nav-label">Moments</span>
      </button>
      <button data-page="bond" onclick="loadPage('bond')">
        <span class="nav-icon">💫</span>
        <span class="nav-label">Bond</span>
      </button>
      <button data-page="profile" onclick="loadPage('profile')">
        <span class="nav-icon">🫧</span>
        <span class="nav-label">You</span>
      </button>
    </nav>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
